[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-downloader"
version = "2.0.0"
description = "CLI tool to download videos and transcripts from edX courses."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rehmat Alam", email = "contact@rehmat.works"},
]
keywords = ["edx", "downloader", "mooc", "video", "courses"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
youtube = ["yt-dlp"]

[project.urls]
Homepage = "https://github.com/rehmatworks/edx-downloader"
Repository = "https://github.com/rehmatworks/edx-downloader"
Issues = "https://github.com/rehmatworks/edx-downloader/issues"

[project.scripts]
edx-dl = "edx_dl.cli:main"
edxdl = "edx_dl.cli:main"

[tool.setuptools.packages.find]
include = ["edx_dl*"]
